replicaCount: 1

image:
  registry: ghcr.io
  repository: flaresolverr/flaresolverr
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""
  sha: ""

# -- Priority class to be assigned to the Pod(s).
priorityClassName: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Environment variables to add to the flaresolverr pods
extraEnv: []
# -- Environment variables from secrets or configmaps to add to the flaresolverr pods
extraEnvFrom: []

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # -- If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Deployment annotations
annotations: {}
podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  privileged: false
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80

serviceMonitor:
  # -- If true, a ServiceMonitor CRD is created for a prometheus operator
  enabled: false
  path: /metrics
  # -- If set create the `ServiceMonitor` in an alternate namespace.
  namespace:
  labels: {}
  interval: 30s
  scheme: http
  tlsConfig: {}
  scrapeTimeout: 30s
  relabelings: []
  metricRelabelings: []
  targetLabels: []
  service:
    # -- Metrics service port to scrape
    port: 8192

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

route:
  main:
    # -- Enables or disables the Gateway API route
    enabled: false
    # -- Set the route apiVersion, e.g. gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1alpha2
    apiVersion: gateway.networking.k8s.io/v1
    # -- Set the route kind.
    # Note that experimental kinds require changing `apiVersion`
    kind: HTTPRoute
    annotations: {}
    labels: {}
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway
    #   sectionName: https
    hostnames: []
    # - chart-example.local
    additionalRules: []
    filters: []
    matches:
      - path:
          type: PathPrefix
          value: /
    # -- To redirect to HTTPS, create a new route object under the main route and enable this option.
    # This should only be used with HTTP-like routes, such as HTTPRoute or GRPCRoute.
    # [Reference]( https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/ )
    httpsRedirect: false

probes:
  # -- Startup probe, holds liveness and readiness until the first success.
  # Useful for slow starts (database migrations). The maximum startup time is `failureThreshold * periodSeconds`.
  startup:
    # -- Enable the startup probe
    enabled: false
    # -- HTTP path probed
    path: /health
    # -- Seconds after the container has started before the probe is initiated
    initialDelaySeconds: 0
    # -- How often (in seconds) to perform the probe
    periodSeconds: 10
    # -- Seconds after which the probe times out
    timeoutSeconds: 1
    # -- Consecutive failures before the container is restarted
    failureThreshold: 30
  liveness:
    # -- HTTP path probed
    path: /health
    # -- Seconds after the container has started before the probe is initiated
    initialDelaySeconds: 0
    # -- How often (in seconds) to perform the probe
    periodSeconds: 10
    # -- Seconds after which the probe times out
    timeoutSeconds: 1
    # -- Consecutive failures before the container is restarted
    failureThreshold: 3
  readiness:
    # -- HTTP path probed
    path: /health
    # -- Seconds after the container has started before the probe is initiated
    initialDelaySeconds: 0
    # -- How often (in seconds) to perform the probe
    periodSeconds: 10
    # -- Seconds after which the probe times out
    timeoutSeconds: 1
    # -- Consecutive successes required to be considered ready again
    successThreshold: 1
    # -- Consecutive failures before the pod is marked unready
    failureThreshold: 3

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
